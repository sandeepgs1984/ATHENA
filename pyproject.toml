[project]
name = "athena"
version = "0.1.0"
description = "ATHENA — Personal AI Decision Intelligence Platform for NSE intraday trading. Not a bot; never places orders."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.13",
    "bcrypt>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
# EMR quantitative modelling/evaluation only (EM-4 Modeling Contract,
# owner-approved 2026-08-27) -- narrowly scoped to logistic regression and
# its numerical support. Not a general ML/scientific-computing dependency:
# no pandas, no gradient-boosting libraries, no deep-learning frameworks.
emr-modeling = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
athena = "athena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Only retain tmp_path dirs for FAILED tests (for debugging) -- passing
# tests' tmp dirs are deleted immediately instead of accumulating for the
# default 3 sessions. 2026-08-28: config_dir-fixture bloat (see conftest.py)
# let retained tmp dirs balloon to 40GB+ within one session and ran the
# shared disk out of space twice.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/athena/domain", "src/athena/config"]
