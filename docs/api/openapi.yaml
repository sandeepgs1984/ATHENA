openapi: 3.1.0
info:
  title: ATHENA Platform API
  description: 'Production REST API for the ATHENA Decision Intelligence Platform — a single-user, advisory-only
    NSE/BSE swing-trading system. ATHENA never places or executes trades; this API is read/inspect/annotate
    only (journal entries and manually-logged fills are the sole write paths that touch the owner''s own
    record-keeping, never a broker order).


    Every endpoint requires authentication (Bearer access token from /api/v1/auth/login) except /api/v1/auth/login
    itself, /api/v1/auth/status, and the platform health/discovery endpoints. Errors follow RFC 7807 Problem
    Details. Collection endpoints share one envelope: {status, data, meta, pagination}.'
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Platform Health
      summary: Get aggregated platform health
      description: Retrieve detailed platform operational and database connectivity metrics.
      operationId: getPlatformHealth
      responses:
        '200':
          description: Returns aggregated health metrics across all components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthDTO'
  /health/live:
    get:
      tags:
      - Platform Health
      summary: Liveness check
      description: Standard k8s/runtime process liveness ping.
      operationId: getLiveness
      responses:
        '200':
          description: Confirm API process is running and responsive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthDTO'
  /health/ready:
    get:
      tags:
      - Platform Health
      summary: Readiness check
      description: Evaluate database connectivity, workspace access, and platform readiness.
      operationId: getReadiness
      responses:
        '200':
          description: Confirm database and external providers are ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthDTO'
  /api/version:
    get:
      tags:
      - Platform Discovery
      summary: Get application version information
      description: Retrieve application identity, build numbers, compile timestamps, and python runtime
        environments.
      operationId: getVersion
      responses:
        '200':
          description: Returns application version metadata and runtime engine statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfoDTO'
  /api/meta:
    get:
      tags:
      - Platform Discovery
      summary: Get platform metadata
      description: Retrieve platform modules compatibility mapping and future AI block placeholders.
      operationId: getMetadata
      responses:
        '200':
          description: Returns registered resources, active API modules, and compatibilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetadataDTO'
  /api/features:
    get:
      tags:
      - Platform Discovery
      summary: Get feature flags
      description: Retrieve active feature flags toggle map.
      operationId: getFeatures
      responses:
        '200':
          description: Returns map of active feature flags configured in current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturesDTO'
  /api/capabilities:
    get:
      tags:
      - Platform Discovery
      summary: Get capability registry
      description: Retrieve structured capabilities matrix listing versions, categorías, and description
        contexts.
      operationId: getCapabilities
      responses:
        '200':
          description: Returns detailed metadata for all registered system capabilities
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CapabilityMetadataDTO'
                type: array
                title: Response Getcapabilities
  /api/info:
    get:
      tags:
      - Platform Discovery
      summary: Get consolidated platform information
      description: Retrieve combined report of versioning, modules, feature configurations, and capabilities.
      operationId: getPlatformInfo
      responses:
        '200':
          description: Returns complete build, metadata, feature flags, and capabilities state for startup
            initialization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInfoDTO'
  /api/v1/health:
    get:
      tags:
      - Platform Health
      - Health
      summary: Get platform health status
      description: 'Retrieve current system and orchestration status check.


        Returns the system-health report, categorized by components.'
      operationId: v1GetHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_HealthResponse_'
  /api/v1/metrics:
    get:
      tags:
      - Platform Health
      - Metrics
      summary: Get platform telemetry and metrics
      description: Retrieve operational metrics including run status and platform counters.
      operationId: v1GetMetrics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_MetricsResponse_'
  /api/v1/auth/status:
    get:
      tags:
      - Auth
      summary: Public auth mode for unlock gate
      description: Return whether the workstation requires unlock before API use.
      operationId: getAuthStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_AuthStatusDTO_'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Unlock with owner credentials
      description: Authenticate owner and issue access + refresh JWTs.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_TokenPairDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate refresh token and issue new access token
      description: Rotate refresh token; revoke the previous session.
      operationId: refreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_TokenPairDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current session
      description: Revoke the session bound to the current access token.
      operationId: logout
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_dict_'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current authenticated principal
      description: Return the unlocked owner/operator identity.
      operationId: getMe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_PrincipalDTO_'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Get aggregated dashboard summary
      description: Retrieve portfolio valuation, regime trend classification, scan dates, and system health
        summaries.
      operationId: getDashboardSummary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DashboardSummaryDTO_'
  /api/v1/dashboard/calendar:
    get:
      tags:
      - Dashboard
      summary: Get trading calendar configuration details
      description: Retrieve holidays, weekly/monthly expiries, special trading sessions, and scheduled
        macroeconomic events.
      operationId: getCalendarData
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_CalendarDataDTO_'
  /api/v1/dashboard/session-status:
    get:
      tags:
      - Dashboard
      summary: Get current exchange session status
      description: Retrieve market-live/review-mode status from ATHENA's Calendar Engine.
      operationId: getMarketSessionStatus
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_MarketSessionStatusDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions:
    get:
      tags:
      - Decisions
      summary: List trading decisions
      description: Retrieve a paginated collection of trading decisions, supporting sorting and filtering.
      operationId: listDecisions
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Date
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Date
      - name: instrument_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Instrument Id
      - name: decision_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Type
      - name: direction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: sort_dir
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          title: Sort Dir
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: next_cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_list_DecisionDTO__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}:
    get:
      tags:
      - Decisions
      summary: Get decision details
      description: Retrieve detailed analysis, quality gates, and trade plans for a specific decision.
      operationId: getDecision
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/depth:
    get:
      tags:
      - Decisions
      summary: Get persisted decision analytical depth
      description: Render eligibility, score, confidence, and risk artifacts without recomputation.
      operationId: getDecisionDepth
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionDepthDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/counterfactual:
    get:
      tags:
      - Decisions
      summary: Get the exact quantified distance from this decision to the TRADE gate
      description: 'Arithmetic over already-persisted score/confidence/risk values and

        current config thresholds — never a recomputed decision (M-X2).'
      operationId: getDecisionCounterfactual
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionCounterfactualDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/plan-freshness:
    get:
      tags:
      - Decisions
      summary: Get the deterministic decay clock for this decision's TradePlan validity window
      description: 'Pure arithmetic over the plan''s already-persisted valid_from/valid_until

        and an as_of instant — never a recomputed plan (M-X3).'
      operationId: getDecisionPlanFreshness
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_TradePlanFreshnessDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/context:
    get:
      tags:
      - Decisions
      summary: Get session/calendar, regime/market-health, and curated links for a decision
      description: 'Render session/calendar context, persisted regime/market-health, and

        owner-curated external links. No news ingestion, no generated rationale.'
      operationId: getDecisionContext
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionContextDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/analogs:
    get:
      tags:
      - Decisions
      summary: Get historical decisions with a similar score/confidence/risk fingerprint
      description: 'Deterministic nearest-neighbor retrieval over persisted decision

        history, with each match''s logged human response and realized outcome

        if any. No generated text, no recomputation of any comparison (M-X1).'
      operationId: getDecisionAnalogs
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionAnalogsDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/journal:
    post:
      tags:
      - Decisions
      summary: Record the owner's response to a decision (accept/reject/ignore)
      description: Persist the owner's response (M-X0, R-9) — nothing is unrecorded.
      operationId: recordDecisionJournalEntry
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordJournalRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_JournalEntryDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Decisions
      summary: Get the owner's most recent response to a decision
      description: None if the owner has never recorded a response for this decision.
      operationId: getDecisionJournalEntry
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_Union_JournalEntryDTO__NoneType__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/outcome:
    post:
      tags:
      - Decisions
      summary: Record the realized outcome for an accepted decision
      description: 'PnL, holding time, and TradePlan adherence are computed server-side —

        deterministic and explainable, never client-supplied (M-X0, ADR-005).'
      operationId: recordTradeOutcome
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordOutcomeRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_TradeOutcomeDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Decisions
      summary: Get the realized outcome for a decision
      description: None if no outcome has been logged for this decision.
      operationId: getTradeOutcome
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_Union_TradeOutcomeDTO__NoneType__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/{decision_id}/trace:
    get:
      tags:
      - Decisions
      summary: Get decision execution trace DAG flow
      description: Retrieve the reasoning DAG trace showing pipeline stages from ingest to safety checks.
      operationId: getDecisionTrace
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_DecisionTraceDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decisions/reset:
    post:
      tags:
      - Decisions
      summary: Reset the Decisions & Trace domain (CONFIRM-gated)
      description: 'Delete all decisions, traces, journal entries, and realized outcomes

        after a typed CONFIRM, with a best-effort automatic backup first. Does

        not touch runs, portfolio positions, or owner candidates.'
      operationId: resetDecisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetDecisionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_ResetDecisionsResultDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/portfolio:
    get:
      tags:
      - Portfolio
      summary: Get portfolio status
      description: Retrieve cash balances, open positions, and sector exposure weights for the portfolio.
      operationId: getPortfolio
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_PortfolioDTO_'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/portfolio/positions:
    post:
      tags:
      - Portfolio
      summary: Log an owner-entered open fill
      description: Record a fill the owner placed on Kite/Groww after an ATHENA suggestion.
      operationId: openPortfolioPosition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPositionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_PortfolioDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/portfolio/positions/reset:
    post:
      tags:
      - Portfolio
      summary: Reset owner fill ledger (CONFIRM-gated)
      description: Delete open or all owner-entered fills after typed CONFIRM. Does not touch decisions/journal.
      operationId: resetPortfolioPositions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPositionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_ResetPositionsResultDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /api/v1/portfolio/positions/{position_id}/close:
    post:
      tags:
      - Portfolio
      summary: Log an owner-entered exit fill
      description: Close a previously logged open position with the owner exit price.
      operationId: closePortfolioPosition
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: position_id
        in: path
        required: true
        schema:
          type: string
          title: Position Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePositionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthenaResponse_PortfolioDTO_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/market/instruments/{instrument_id}/candles:
    get:
      tags:
      - Market
      summary: Recent persisted candles for an instrument
      description: Return chronological OHLCV from the validated SQLite ledger only.
      operationId: getInstrumentCandles
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: instrument_id
