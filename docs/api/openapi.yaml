          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Value
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
        completeness:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Completeness
        explanation:
          type: string
          title: Explanation
          default: ''
        dimensions:
          items:
            $ref: '#/components/schemas/AnalysisDimensionDTO'
          type: array
          title: Dimensions
      type: object
      required:
      - status
      title: AnalysisBlockDTO
      description: Persisted score, confidence, or risk block.
    AnalysisContributionDTO:
      properties:
        source:
          type: string
          title: Source
        reference:
          type: string
          title: Reference
          default: ''
        description:
          type: string
          title: Description
        points:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Points
      type: object
      required:
      - source
      - description
      title: AnalysisContributionDTO
      description: One persisted, source-attributed input to an analytical dimension.
    AnalysisDimensionDTO:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          title: Status
        value:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Value
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
        weight:
